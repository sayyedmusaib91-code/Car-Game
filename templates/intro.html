<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Clash Intro</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #000000, #050d1a, #000000);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
}

/* Center content */
.intro-content {
    text-align: center;
}

/* 🎮 LOGO (AB UPAR) */
#gameLogo {
    width: 220px;
    opacity: 0;
    transform: scale(0.6);

    animation: logoAnim 5s ease forwards;

    filter: drop-shadow(0 0 10px #f2f3f3);
    margin-bottom: 20px;
}

/* 🔥 TEXT (AB NICHE) */
.madeby {
    font-size: 40px;
    color: #000000;
    letter-spacing: 3px;

    opacity: 0;
    animation: textFade 5s ease forwards;

    text-shadow: 0 0 10px #ffffff,
                 0 0 20px #f5f5f5,
                 0 0 40px #ffffff;
}

/* LOGO ANIMATION */
@keyframes logoAnim {
    0% { opacity: 0; transform: scale(0.5); }
    20% { opacity: 1; transform: scale(1.15); }
    50% { transform: scale(1); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: scale(0.8); }
}

/* TEXT ANIMATION */
@keyframes textFade {
    0% { opacity: 0; transform: translateY(20px); }
    20% { opacity: 1; transform: translateY(0); }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateY(20px); }
}

/* Fade overlay */
.fade-overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: black;
    opacity: 0;
    animation: fadeOut 5s forwards;
}

@keyframes fadeOut {
    0% { opacity: 1; }
    20% { opacity: 0; }
    80% { opacity: 0; }
    100% { opacity: 1; }
}
</style>
</head>

<body>

<div class="intro-content">

    <!-- 🔥 LOGO UPAR -->
    <img src="/static/image/unity.png" id="gameLogo">

    <!-- 🔥 TEXT NICHE -->
    <h1 class="madeby">POWERED BY UNITY</h1>

</div>

<div class="fade-overlay"></div>

<script>
setTimeout(() => {
    window.location.href = "/login";
}, 5000);
</script>

</body>
</html>
