<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Clash - Signup</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: sans-serif;
            background: url('/static/image/.png') no-repeat center center fixed;
            background-size: cover; display: flex; justify-content: center;
            align-items: center; height: 100vh; color: white;
        }
        .card {
            background: rgba(0, 0, 0, 0.85); padding: 40px;
            border-radius: 15px; width: 350px; text-align: center;
            border: 1px solid #00d2ff;
        }
        h2 { color: #00d2ff; margin-bottom: 20px; }
        input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            border-radius: 5px; border: 1px solid #444;
            background: rgba(255, 255, 255, 0.05); color: white;
            box-sizing: border-box;
        }
        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 5px;
            background: #00d2ff; color: black; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Player Account</h2>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <p style="color: #0ce900; font-size: 14px;">{{ message }}</p>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/signup" method="POST">
            <input type="text" name="username" placeholder="Choose Username" required>
            <input type="password" name="password" placeholder="Set Password" required>
            <button type="submit" class="btn">REGISTER</button>
        </form>
        <p style="margin-top: 15px; font-size: 13px;">Already have an account? <a href="/login" style="color: #00d2ff;">Login</a></p>
    </div>
</body>
</html>
